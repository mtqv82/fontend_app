<div class="modal-overlay" id="modal-confirm-delete">
  <div
    class="modal-box"
    style="
      max-width: 400px;
      text-align: center;
      padding: 30px 25px;
      border-radius: 12px;
      background: #fff;
    "
  >
    <i
      class="fa-solid fa-triangle-exclamation"
      style="font-size: 56px; color: #ef4444; margin-bottom: 20px"
    ></i>
    <h2 style="font-size: 20px; color: #1e293b; margin: 0 0 10px 0">
      Xác nhận xóa linh kiện
    </h2>
    <p
      style="
        color: #64748b;
        margin-bottom: 25px;
        font-size: 14px;
        line-height: 1.5;
      "
    >
      Bạn có chắc chắn muốn xóa linh kiện này khỏi kho? Hành động này không thể
      hoàn tác.
    </p>
    <div style="display: flex; justify-content: center; gap: 12px">
      <button
        class="btn btn-white"
        id="btn-cancel-delete"
        style="
          padding: 10px 24px;
          border: 1px solid #cbd5e1;
          border-radius: 6px;
          cursor: pointer;
          font-weight: 500;
        "
      >
        Hủy bỏ
      </button>
      <button
        class="btn btn-red"
        id="btn-confirm-delete"
        style="
          padding: 10px 24px;
          background: #ef4444;
          color: white;
          border: none;
          border-radius: 6px;
          cursor: pointer;
          font-weight: 500;
        "
      >
        Xóa sản phẩm
      </button>
    </div>
  </div>
</div>
