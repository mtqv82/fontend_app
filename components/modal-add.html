<div id="modal-add-product" class="modal-overlay">
    <div class="modal-content modal-content-add-product">
        <div class="modal-header">
            <h2><i class="fa-solid fa-layer-group" style="margin-right: 8px; color: var(--color-primary);"></i>Thêm Linh
                Kiện Mới</h2>
            <button class="btn-close" id="btn-close-modal"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="modal-body custom-scrollbar">
            <form id="form-add-product">

                <!-- NHÓM 1: THÔNG TIN CƠ BẢN -->
                <h3 class="section-title">Thông tin cơ bản</h3>
                <div class="form-grid-horizontal">
                    <!-- Cột Trái -->
                    <div class="form-group-hz">
                        <label>Mã SKU <span class="required">*</span></label>
                        <input type="text" id="add-sku" placeholder="VD: RAM-001" required>
                    </div>
                    <!-- Cột Phải -->
                    <div class="form-group-hz">
                        <label>Tên sản phẩm <span class="required">*</span></label>
                        <input type="text" id="add-name" placeholder="VD: RAM Corsair 16GB" required>
                    </div>

                    <!-- Cột Trái -->
                    <div class="form-group-hz">
                        <label>S/N (Serial)</label>
                        <textarea id="add-sn" rows="3"
                            placeholder="Nhập nhiều S/N: Mỗi mã 1 dòng hoặc cách nhau bằng dấu phẩy..."></textarea>
                    </div>
                    <!-- Cột Phải -->
                    <div class="form-group-hz">
                        <label>Loại linh kiện</label>
                        <select id="add-category">

                        </select>
                    </div>

                    <!-- Cột Trái -->
                    <div class="form-group-hz">
                        <label>NPP / Hãng</label>
                        <div style="position: relative; width: 100%;">
                            <input type="text" id="add-brand" class="form-control"
                                placeholder="Gõ chọn hoặc nhập hãng mới..." autocomplete="off">
                            <ul id="brand-list-add" class="custom-suggest-list" style="display: none;"></ul>
                        </div>
                    </div>
                    <!-- Cột Phải -->
                    <div class="form-group-hz">
                        <label>Tình trạng</label>
                        <select id="add-condition">
                            <option value="Mới 100%">Mới 100%</option>
                            <option value="Like New 99%">Like New 99%</option>
                            <option value="Hàng Cũ (2nd)">Hàng Cũ (2nd)</option>
                        </select>
                    </div>
                </div>

                <!-- NHÓM 2: GIÁ & TỒN KHO -->
                <h3 class="section-title" style="margin-top: 25px;">Giá bán & Tồn kho</h3>
                <div class="form-grid-horizontal">
                    <div class="form-group-hz">
                        <label>Số lượng tồn</label>
                        <input type="number" id="add-stock" value="1" min="0">
                    </div>
                    <div class="form-group-hz">
                        <label>Bảo hành</label>
                        <input type="text" id="add-warranty" value="36 Tháng">
                    </div>

                    <div class="form-group-hz">
                        <label>Giá Vốn</label>
                        <div class="input-with-icon">
                            <input type="text" id="add-cost" placeholder="0">
                            <span class="currency">đ</span>
                        </div>
                    </div>
                    <div class="form-group-hz">
                        <label>Giá Thợ</label>
                        <div class="input-with-icon">
                            <input type="text" id="add-dealer" placeholder="0">
                            <span class="currency">đ</span>
                        </div>
                    </div>

                    <div class="form-group-hz">
                        <label>Giá Lẻ <span class="required">*</span></label>
                        <div class="input-with-icon">
                            <input type="text" id="add-retail" placeholder="0" required class="input-highlight">
                            <span class="currency">đ</span>
                        </div>
                    </div>
                    <div class="form-group-hz">
                        <label>Ghi chú</label>
                        <input type="text" id="add-note" placeholder="Thông tin thêm (nếu có)...">
                    </div>
                </div>
            </form>
        </div>

        <div class="modal-footer">
            <button class="btn btn-outline" id="btn-cancel-modal">Hủy bỏ</button>
            <button class="btn btn-purple" id="btn-submit-add"><i class="fa-solid fa-check"></i> Lưu Sản Phẩm</button>
        </div>
    </div>
</div>
